<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coinFace" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(92 72) rotate(48) scale(196)">
      <stop offset="0" stop-color="#FFF7B3"/>
      <stop offset="0.34" stop-color="#FFD84A"/>
      <stop offset="0.68" stop-color="#F6A800"/>
      <stop offset="1" stop-color="#C96A00"/>
    </radialGradient>

    <linearGradient id="coinEdge" x1="44" y1="36" x2="218" y2="228" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1A3"/>
      <stop offset="0.26" stop-color="#FFC928"/>
      <stop offset="0.62" stop-color="#E88A00"/>
      <stop offset="1" stop-color="#9E4B00"/>
    </linearGradient>

    <linearGradient id="innerRing" x1="64" y1="56" x2="196" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4A0"/>
      <stop offset="0.5" stop-color="#F6B000"/>
      <stop offset="1" stop-color="#C66A00"/>
    </linearGradient>

    <linearGradient id="leafFill" x1="92" y1="76" x2="171" y2="173" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFFFF0"/>
      <stop offset="0.55" stop-color="#BDF07A"/>
      <stop offset="1" stop-color="#62B84D"/>
    </linearGradient>

    <linearGradient id="leafStroke" x1="91" y1="80" x2="176" y2="181" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F8E36"/>
      <stop offset="1" stop-color="#1E5E2B"/>
    </linearGradient>

    <filter id="shadow" x="18" y="20" width="220" height="224" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#6B3A00" flood-opacity="0.28"/>
    </filter>

    <filter id="softGlow" x="52" y="54" width="154" height="150" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0
                0 0.8 0 0 0.25
                0 0 0.2 0 0
                0 0 0 0.45 0"/>
    </filter>

    <clipPath id="coinClip">
      <circle cx="128" cy="128" r="92"/>
    </clipPath>
  </defs>

  <!-- Coin body -->
  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="101" fill="url(#coinEdge)"/>
    <circle cx="128" cy="128" r="91" fill="url(#coinFace)"/>
    <circle cx="128" cy="128" r="79" stroke="url(#innerRing)" stroke-width="7"/>
    <circle cx="128" cy="128" r="73" stroke="#FFE778" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- Subtle decorative rays -->
  <g clip-path="url(#coinClip)" opacity="0.22">
    <path d="M128 42V75" stroke="#FFF9C8" stroke-width="5" stroke-linecap="round"/>
    <path d="M128 181V214" stroke="#B76000" stroke-width="5" stroke-linecap="round"/>
    <path d="M42 128H75" stroke="#FFF9C8" stroke-width="5" stroke-linecap="round"/>
    <path d="M181 128H214" stroke="#B76000" stroke-width="5" stroke-linecap="round"/>
    <path d="M67 67L90 90" stroke="#FFF9C8" stroke-width="4" stroke-linecap="round"/>
    <path d="M166 166L189 189" stroke="#B76000" stroke-width="4" stroke-linecap="round"/>
    <path d="M189 67L166 90" stroke="#FFF9C8" stroke-width="4" stroke-linecap="round"/>
    <path d="M90 166L67 189" stroke="#B76000" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Emblem glow -->
  <ellipse cx="128" cy="132" rx="58" ry="50" fill="#FFF6A8" opacity="0.28" filter="url(#softGlow)"/>

  <!-- AVORA sprout emblem -->
  <g stroke="url(#leafStroke)" stroke-linecap="round" stroke-linejoin="round">
    <!-- stem -->
    <path d="M126 177C126 149 126 124 130 102" stroke-width="10"/>
    <path d="M128 177C128 149 128 124 132 102" stroke="#F2FFD8" stroke-width="3.2" opacity="0.82"/>

    <!-- left leaf -->
    <path d="M129 122C108 123 89 112 82 90C104 86 123 94 134 110C136 114 135 119 129 122Z"
      fill="url(#leafFill)" stroke-width="6"/>
    <path d="M91 94C106 99 118 108 130 119" stroke="#F4FFE0" stroke-width="3" opacity="0.9"/>

    <!-- right leaf -->
    <path d="M132 111C140 88 159 75 184 77C182 101 164 119 140 123C135 124 130 119 132 111Z"
      fill="url(#leafFill)" stroke-width="6"/>
    <path d="M177 83C160 91 146 103 135 118" stroke="#F4FFE0" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Ground arc / farm field -->
  <path d="M82 181C98 168 111 164 128 164C145 164 160 169 175 181"
    stroke="#7B4A12" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
  <path d="M92 181C104 174 115 171 128 171C141 171 153 174 164 181"
    stroke="#FFF0A3" stroke-width="3.5" stroke-linecap="round" opacity="0.92"/>

  <!-- Highlights -->
  <path d="M73 73C88 55 109 46 132 46" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.38"/>
  <circle cx="74" cy="98" r="5" fill="#FFFBD6" opacity="0.82"/>
  <circle cx="188" cy="166" r="4" fill="#FFF6B3" opacity="0.55"/>
</svg>
